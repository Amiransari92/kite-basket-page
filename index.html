<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kite basket</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#ddd; --btn:#387ed1; --err:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --muted:#9a9a9a; --line:#333; --btn:#5b9be6; --err:#ff6b5b; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; max-width:560px; margin-inline:auto; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  p { color:var(--muted); margin:4px 0 12px; }
  table { width:100%; border-collapse:collapse; margin:12px 0; font-size:.95rem; }
  td, th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  .buy { color:#2e9e5b; font-weight:600; } .sell { color:#d9534f; font-weight:600; }
  button { width:100%; padding:14px; font-size:1rem; border:0; border-radius:8px; background:var(--btn); color:#fff; }
  .err { color:var(--err); }
</style>
</head>
<body>
<h1>Kite basket</h1>
<p id="status">Loading your orders...</p>
<table id="orders" hidden><thead><tr><th>Side</th><th>Symbol</th><th>Qty</th><th>Limit</th></tr></thead><tbody></tbody></table>
<button id="send" hidden>Open in Kite</button>

<!--
  What this page does, in full: read ?b=<id>, fetch that order list from our own small
  AWS endpoint, and submit it as a hidden form POST to Kite's published basket endpoint.
  You then confirm (or edit) the orders on Kite's own screen. Nothing is sent anywhere else.
  The api_key is Kite Publisher's PUBLIC key; the secret is never used or stored here.
-->
<script src="config.js"></script>
<script>
(function () {
  var statusEl = document.getElementById('status');
  var table = document.getElementById('orders');
  var btn = document.getElementById('send');
  var KITE_BASKET_URL = 'https://kite.zerodha.com/connect/basket';

  function fail(msg) { statusEl.textContent = msg; statusEl.className = 'err'; }

  var id = new URLSearchParams(location.search).get('b') || '';
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(id)) { return fail('Invalid or missing basket link.'); }
  var base = (window.KITE_BASKET_CONFIG || {}).lambdaUrl || '';
  if (!base) { return fail('Page is not configured yet (lambdaUrl missing).'); }

  function submitToKite(doc) {
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = KITE_BASKET_URL;
    [['api_key', doc.api_key], ['data', JSON.stringify(doc.orders)]].forEach(function (kv) {
      var input = document.createElement('input');
      input.type = 'hidden'; input.name = kv[0]; input.value = kv[1];
      form.appendChild(input);
    });
    document.body.appendChild(form);
    form.submit();
  }

  fetch(base.replace(/\/$/, '') + '/?b=' + encodeURIComponent(id), { cache: 'no-store' })
    .then(function (r) {
      if (r.status === 404) { throw new Error('This basket link has expired or does not exist.'); }
      if (!r.ok) { throw new Error('Could not load the basket (HTTP ' + r.status + ').'); }
      return r.json();
    })
    .then(function (doc) {
      if (!doc || !doc.api_key || !Array.isArray(doc.orders) || !doc.orders.length) {
        throw new Error('Basket is empty or malformed.');
      }
      var tbody = table.querySelector('tbody');
      doc.orders.forEach(function (o) {
        var tr = document.createElement('tr');
        [[o.transaction_type, o.transaction_type === 'BUY' ? 'buy' : 'sell'], [o.tradingsymbol, ''], [o.quantity, ''], [o.price, '']]
          .forEach(function (cell) {
            var td = document.createElement('td'); td.textContent = cell[0]; if (cell[1]) { td.className = cell[1]; }
            tr.appendChild(td);
          });
        tbody.appendChild(tr);
      });
      table.hidden = false;
      statusEl.textContent = doc.note || 'Review, then tap the button. You confirm on Kite next.';
      btn.hidden = false;
      btn.addEventListener('click', function () { submitToKite(doc); });
      // Auto-send after a short pause; the button stays as a fallback (iOS webviews may block it).
      setTimeout(function () { submitToKite(doc); }, 1500);
    })
    .catch(function (e) { fail(e.message); });
})();
</script>
</body>
</html>
