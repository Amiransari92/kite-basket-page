<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kite basket done</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --muted:#9a9a9a; } }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; max-width:560px; margin-inline:auto; }
  p { color:var(--muted); }
</style>
</head>
<body>
<h1>Done</h1>
<p id="msg">You are back from Kite. Check the order book in Kite for the result.</p>
<p id="params"></p>
<script>
  // Shows only the non-secret status parameter Kite appends. Any token is deliberately not displayed.
  var p = new URLSearchParams(location.search);
  if (p.get('status')) { document.getElementById('params').textContent = 'Kite status: ' + p.get('status'); }
  if (history.replaceState) { history.replaceState(null, '', location.pathname); } // drop the query (tokens) from the address bar
</script>
</body>
</html>
